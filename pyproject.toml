[project]
name = "emergent-politeness"
version = "0.1.0"
description = "Embodied multi-agent simulation of emergent politeness and rudeness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pymunk>=6.6",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_politeness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
